name: snapshot

on:
  # Schedule paused until the EU fetch relay is live — US-vantage fetches
  # record region artifacts as changes. Re-enable after a clean relay run.
  # schedule:
  #   - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# A manual test-fire must never race the daily cron to the same commit:
# queue the second run instead of interleaving pushes.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Snapshot policy documents
        run: node tools/snapshot.mjs

      - name: Snapshot App Store privacy labels
        run: node tools/labels.mjs

      - name: Headless lane (JS-rendered targets)
        run: |
          npm install --no-save --no-package-lock playwright >/dev/null 2>&1 \
            && npx playwright install --with-deps chromium >/dev/null 2>&1 \
            && node tools/headless.mjs || echo "headless lane skipped"

      - name: Record history entries
        run: node tools/history.mjs

      - name: Verify quoted lines still exist in the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! node tools/verify-quotes.mjs; then
            OPEN=$(gh issue list -R "${{ github.repository }}" --state open \
              --search "Quote rot in:title" --json number --jq 'length')
            if [ "$OPEN" = "0" ]; then
              gh issue create -R "${{ github.repository }}" \
                --title "Quote rot detected ($(date -u +%F))" \
                --body "A quote shown on a company page no longer appears in that company's archived documents. The company likely edited the quoted line — check today's diff, then update or remove the quote in companies.json. Quotes must never outlive their evidence."
            fi
          fi

      - name: Independent Wayback capture of changed sources
        run: node tools/wayback.mjs || true

      - name: Flag changes touching scanning language for review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/triage.mjs || true

      - name: Send push alerts for today's changes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          npm install --no-save --no-package-lock web-push @neondatabase/serverless >/dev/null 2>&1 \
            && node tools/push.mjs || echo "push lane skipped"

      - name: Send email alert digest for today's changes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node tools/mail.mjs || true

      - name: Announce today's changes on Mastodon
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: node tools/toot.mjs || true

      - name: Commit changes
        run: |
          git config user.name "Myrhex-x"
          git config user.email "274539396+Myrhex-x@users.noreply.github.com"
          git add archive history.json changes
          if git diff --cached --quiet; then
            echo "No changes today."
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only | cut -d/ -f2 | sort -u | paste -sd ", " -)
          git commit -m "snapshot $(date -u +%F): ${CHANGED}"
          git push
