name: snapshot

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Snapshot policy documents
        run: node tools/snapshot.mjs

      - name: Snapshot App Store privacy labels
        run: node tools/labels.mjs

      - name: Commit changes
        run: |
          git config user.name "Myrhex-x"
          git config user.email "274539396+Myrhex-x@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then
            echo "No changes today."
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only | cut -d/ -f2 | sort -u | paste -sd ", " -)
          git commit -m "snapshot $(date -u +%F): ${CHANGED}"
          git push
